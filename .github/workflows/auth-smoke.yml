name: Auth Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run complete authentication and critical regression checks
        run: npm run test:auth:full
      - name: Run integration availability checks
        run: npm run test:integrations
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile critical journeys and accessibility smoke
        run: npm run test:e2e:critical
      - name: Verify calendar month headings across phone and grid layouts
        run: npx playwright test e2e/calendar-month-headings.spec.mjs --workers=1
      - name: Run calendar copy/privacy/load acceptance with isolated SQL fixtures
        run: npm run test:e2e:calendar-gaps
      - name: Verify free athlete access and public copy
        run: npm run test:e2e:free-access
      - name: Verify public navigation, forms and accessible mobile menu
        run: npm run test:e2e:public-interface
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-journey-failures
          path: |
            webapp/test-results
            output/playwright/calendar-gaps
          retention-days: 7
